name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "data-integration"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
      - name: Inspect Pages API
        run: |
          mkdir -p debug_logs
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages > debug_logs/pages.json || true
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/deployments > debug_logs/deployments.json || true
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Capture Deploy Step Output
        if: always()
        run: |
          echo "Outcome: ${{ steps.deployment.outcome }}" > debug_logs/outcome.txt
          echo "Conclusion: ${{ steps.deployment.conclusion }}" >> debug_logs/outcome.txt
      - name: Upload Debug Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages-log
          path: debug_logs
