name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "data-integration"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Unlock stuck ghost deployments
        run: |
          python3 -c "
          import urllib.request, json, os

          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'Actions-Deploy-Fix'
          }

          try:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/deployments?per_page=30', headers=headers)
              with urllib.request.urlopen(req) as resp:
                  deployments = json.loads(resp.read().decode())
              
              print(f'Checking {len(deployments)} deployments for stuck state...')
              for dep in deployments:
                  dep_id = dep.get('id')
                  env = dep.get('environment')
                  sha = dep.get('sha', '')
                  if env != 'github-pages':
                      continue
                  
                  # Cancel Pages-specific deployment by SHA
                  if sha:
                      try:
                          c_req = urllib.request.Request(
                              f'https://api.github.com/repos/{repo}/pages/deployments/{sha}/cancel',
                              headers=headers,
                              data=b'',
                              method='POST'
                          )
                          urllib.request.urlopen(c_req)
                          print(f'Cancelled pages deployment for {sha[:7]}')
                      except Exception:
                          pass

                  s_req = urllib.request.Request(f'https://api.github.com/repos/{repo}/deployments/{dep_id}/statuses', headers=headers)
                  with urllib.request.urlopen(s_req) as s_resp:
                      statuses = json.loads(s_resp.read().decode())
                  latest_state = statuses[0].get('state') if statuses else 'unknown'
                  
                  if latest_state in ['in_progress', 'queued', 'waiting']:
                      print(f'Cancelling stuck deployment {dep_id} (state: {latest_state})...')
                      fail_req = urllib.request.Request(
                          f'https://api.github.com/repos/{repo}/deployments/{dep_id}/statuses',
                          headers=headers,
                          data=json.dumps({'state': 'failure', 'description': 'Auto-cleared stuck deployment'}).encode(),
                          method='POST'
                      )
                      try:
                          urllib.request.urlopen(fail_req)
                          print(f'Marked deployment {dep_id} failure')
                      except Exception as e:
                          print(f'Error marking failure: {e}')
          except Exception as e:
              print(f'Deployment cleanup note: {e}')
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          timeout: 600000
          error_count: 10
