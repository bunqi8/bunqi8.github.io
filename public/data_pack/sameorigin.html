<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>SameOrigin</title>
</head>
<body>
<script>
// TradingView relies on this script to communicate with the iframe.
if (window.parent !== window) {
    window.addEventListener("message", function(e) {
        if (e.data && e.data.name === "widgetReady") {
            window.parent.postMessage(e.data, "*");
        }
    });
}
</script>
</body>
</html>
