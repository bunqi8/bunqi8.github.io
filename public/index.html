<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate TradingView Frontend</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #ffffff; display: flex; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #tv_chart_container { flex-grow: 1; height: 100vh; position: relative; }
        #options_chain_container { 
            width: 450px; 
            height: 100vh; 
            border-left: 1px solid #e0e3eb; 
            display: flex; 
            flex-direction: column;
            background: #ffffff;
            z-index: 10;
        }
    </style>
    <!-- Load the lightly obfuscated core engine -->
    <script src="chart_engine/core.standalone.js"></script>
    <script type="module" src="duckdb-init.js"></script>
    <script src="datafeed.js"></script>
    <script type="module" src="options_chain.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <div id="tv_chart_container"></div>
    <div id="options_chain_container">
        <!-- Options chain UI will be injected here by options_chain.js -->
    </div>
</body>
</html>
